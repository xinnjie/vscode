name: Extract VS Code Actions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/vs/platform/actions/common/actions.ts'
      - 'src/vs/**/*Action*.ts'
      - 'scripts/parse-actions-log.js'

jobs:
  extract-actions:
    name: Extract Actions Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node build/azure-pipelines/common/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
      - name: Cache node modules
        id: cacheNodeModules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-cacheNodeModules20-${{ steps.nodeModulesCacheKey.outputs.value }}
          restore-keys: ${{ runner.os }}-cacheNodeModules20-
      - name: Get npm cache directory path
        id: npmCacheDirPath
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
      - name: Cache npm directory
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.npmCacheDirPath.outputs.dir }}
          key: ${{ runner.os }}-npmCacheDir-${{ steps.nodeModulesCacheKey.outputs.value }}
          restore-keys: ${{ runner.os }}-npmCacheDir-
      - name: Install system dependencies
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        run: |
          sudo apt update
          sudo apt install -y libxkbfile-dev pkg-config libkrb5-dev libxss1 xvfb libgtk-3-0 libgbm1
      - name: Execute npm
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci

      - name: Compile source code
        run: npm run compile

      - name: Run VS Code and capture logs
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
          timeout 120 ./scripts/code.sh --no-sandbox --disable-dev-shm-usage 2>&1 | tee /tmp/vscode.log || true
          sleep 5

      - name: Parse actions from logs
        run: |
          node scripts/parse-actions-log.js /tmp/vscode.log > actions.json
          ACTION_COUNT=$(jq '. | length' actions.json)
          echo "Extracted $ACTION_COUNT actions"

          if [ "$ACTION_COUNT" -lt 100 ]; then
            echo "Warning: Only extracted $ACTION_COUNT actions, expected more"
            exit 1
          fi

      - name: Generate metadata
        run: |
          cat > actions-metadata.json << EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "commit_message": $(echo '${{ github.event.head_commit.message }}' | jq -Rs .),
            "branch": "${{ github.ref_name }}",
            "action_count": $(jq '. | length' actions.json)
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-actions-${{ github.sha }}
          path: |
            actions.json
            actions-metadata.json
          retention-days: 90

      - name: Create summary
        run: |
          echo "## VS Code Actions Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Actions:** $(jq '. | length' actions.json)" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top 10 Categories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          jq -r '
            group_by(.category) |
            map({category: (if (.[0].category == null or .[0].category == "") then "Uncategorized" else .[0].category end), count: length}) |
            sort_by(-.count) |
            .[:10] |
            .[] |
            "- **\(.category)**: \(.count)"
          ' actions.json >> $GITHUB_STEP_SUMMARY

      - name: Create PR to onekeymap-cli repository
        env:
          GH_TOKEN: ${{ secrets.ONEKEYMAP_PR_TOKEN }}
        run: |
          gh auth setup-git
          git clone https://github.com/xinnjie/onekeymap-cli.git /tmp/onekeymap-cli
          cd /tmp/onekeymap-cli
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="update-vscode-actions-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          mkdir -p doc
          cp $GITHUB_WORKSPACE/actions.json doc/vscode-actions.json
          git add doc/vscode-actions.json
          if git diff --staged --quiet; then
            echo "No changes detected, skipping PR creation"
            exit 0
          fi
          ACTION_COUNT=$(jq '. | length' doc/vscode-actions.json)
          git commit -m "Update VS Code actions metadata

          - Total actions: $ACTION_COUNT
          - Generated from: ${{ github.repository }}@${{ github.sha }}
          - Generated at: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --repo xinnjie/onekeymap-cli \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Update VS Code actions metadata ($(date +%Y-%m-%d))" \
            --body "## Automated Update

          This PR updates the VS Code actions metadata file.

          **Details:**
          - Total actions: $ACTION_COUNT
          - Source commit: [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - Generated at: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)

          ### Top Categories
          $(jq -r 'group_by(.category) | map({category: (if (.[0].category == null or .[0].category == "") then "Uncategorized" else .[0].category end), count: length}) | sort_by(-.count) | .[:5] | .[] | "- **\(.category)**: \(.count)"' doc/vscode-actions.json)

          ---
          *This PR was automatically generated by the VS Code Actions extraction workflow.*"
